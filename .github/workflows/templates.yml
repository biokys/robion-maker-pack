# Smoke-tests the product templates end to end: scaffold a project the way
# the skill does (common + stack), then run the real pipeline per stack.
# Solids: model -> check -> drawings -> PNG/PDF plus the negative gates
# (fea refusal, drafting-helpers degrade). Patterns2d: pattern -> check ->
# bom -> A4 tiling -> PDF, plus previews/hero PNGs via Chrome.
#
# Deliberately NO uv.lock: every run resolves fresh, so this doubles as a
# canary for upstream breakage (a new build123d or drafting-helpers release)
# — exactly what a product project would hit at `uv sync` time.
#
# Blender viz is skipped: a multi-hundred-MB install plus minutes of Cycles
# render; the viz path stays covered by local `make doctor` + product runs.
name: templates

on:
  push:
    branches: [main]
    paths:
      - "skills/physical-product/templates/**"
      - ".github/workflows/templates.yml"
  pull_request:
    paths:
      - "skills/physical-product/templates/**"
      - ".github/workflows/templates.yml"

concurrency:
  group: templates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solids:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # runner.* is not a valid context in job-level env — use the workspace
      PROJ: ${{ github.workspace }}/proj
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "skills/physical-product/templates/solids/pyproject.toml"

      - name: System deps for OCP (libGL)
        run: sudo apt-get update -q && sudo apt-get install -y -q libgl1

      - name: Scaffold project from templates (as the skill does)
        run: |
          mkdir -p "$PROJ"
          cp -R skills/physical-product/templates/common/. "$PROJ/"
          cp -R skills/physical-product/templates/solids/. "$PROJ/"

      - name: Design record script (init, stage, next, check --strict)
        working-directory: ${ env.PROJ }
        run: |
          python3 design_record.py init --name "CI solids" --slug ci-solids --language en \
            --idea "a smoke-test product" --summary "exercises the record script" \
            --verticals woodworking --stack solids
          python3 design_record.py stage brief done
          python3 design_record.py next concept --estimate "a minute"
          python3 design_record.py check --strict
          git log --oneline | grep -q "idea: recorded"

      - name: uv sync (with the recognise extra — exercises auto_holes)
        working-directory: ${{ env.PROJ }}
        run: uv sync --extra recognise

      - name: Font (osifont — exercises the ISO 3098 lettering path)
        working-directory: ${{ env.PROJ }}
        run: make font

      - name: Model pipeline (export, bom, check, cutlist, drawings)
        working-directory: ${{ env.PROJ }}
        run: |
          uv run model.py export
          uv run model.py bom
          uv run model.py check
          uv run cutlist.py > /dev/null
          uv run drawings.py

      - name: Assert expected outputs
        working-directory: ${{ env.PROJ }}
        run: |
          for f in out/parts/bracket.step out/parts/bracket.stl out/bom.md \
                   out/cutlist.md out/cutlist.svg \
                   out/drawings/bracket.svg out/drawings/bracket.dxf \
                   out/drawings/overview.svg out/drawings/manifest.json; do
            test -f "$f" || { echo "MISSING $f"; exit 1; }
          done
          grep -q "Total mass of parts" out/bom.md
          grep -q "Purchasing summary" out/cutlist.md
          uv run python -c "import json; json.load(open('out/drawings/manifest.json'))"

      - name: PNG smoke via preinstalled Chrome
        working-directory: ${{ env.PROJ }}
        run: |
          make drawings-png CHROME=google-chrome
          find out/drawings -name 'bracket.png' -size +20k | grep -q . \
            || { echo "bracket.png missing or suspiciously small"; exit 1; }

      - name: PDF smoke (merge_pdfs.py + manifest order)
        working-directory: ${{ env.PROJ }}
        run: |
          make drawings-pdf CHROME=google-chrome
          test -f out/drawings/drawings_A3.pdf

      - name: Drawing lint selftest (deliberately broken sheet must trip)
        working-directory: ${{ env.PROJ }}
        run: uv run drawings.py lint-selftest

      - name: FEA gate must refuse incomplete analytics (nonzero is EXPECTED)
        working-directory: ${{ env.PROJ }}
        run: |
          if uv run fea.py --analytic-only; then
            echo "fea gate FAILED TO FAIL — incomplete ANALYTIC accepted"
            exit 1
          fi
          echo "fea gate refused as expected"

      # LAST: mutates the venv. `--no-sync` is load-bearing — plain `uv run`
      # would re-sync and silently reinstall the package just uninstalled.
      - name: Degrade test — drawings survive without drafting-helpers
        working-directory: ${{ env.PROJ }}
        run: |
          uv pip uninstall build123d-drafting-helpers
          uv run --no-sync drawings.py | tee degrade.log
          grep -q "WARNING: build123d_drafting unavailable" degrade.log
          test -f out/drawings/bracket.svg

  patterns2d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJ: ${{ github.workspace }}/patproj
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "skills/physical-product/templates/patterns2d/pyproject.toml"

      - name: Scaffold project from templates (as the skill does)
        run: |
          mkdir -p "$PROJ"
          cp -R skills/physical-product/templates/common/. "$PROJ/"
          cp -R skills/physical-product/templates/patterns2d/. "$PROJ/"

      - name: Design record script (init, stage, next, check --strict)
        working-directory: ${ env.PROJ }
        run: |
          python3 design_record.py init --name "CI patterns2d" --slug ci-patterns2d --language en \
            --idea "a smoke-test product" --summary "exercises the record script" \
            --verticals woodworking --stack patterns2d
          python3 design_record.py stage brief done
          python3 design_record.py next concept --estimate "a minute"
          python3 design_record.py check --strict
          git log --oneline | grep -q "idea: recorded"

      - name: uv sync
        working-directory: ${{ env.PROJ }}
        run: uv sync

      - name: Pattern pipeline (check, export, bom, tiling, viz)
        working-directory: ${{ env.PROJ }}
        run: |
          uv run pattern.py check
          uv run pattern.py export
          uv run pattern.py bom
          uv run tile_a4.py
          uv run viz.py

      - name: Assert expected outputs
        working-directory: ${{ env.PROJ }}
        run: |
          for f in out/pieces/front_panel.svg out/pieces/front_panel.html \
                   out/layout.svg out/layout.html out/viz_hero.svg \
                   out/viz_hero.html out/bom.md out/print/pattern_A4.html; do
            test -f "$f" || { echo "MISSING $f"; exit 1; }
          done
          grep -q "Buy (with" out/bom.md
          grep -Eq '[0-9],[0-9]{2} m' out/bom.md   # locale decimal separator
          grep -q "CONTROL SQUARE" out/print/pattern_A4.html
          # internal marks must reach the piece SVG and the 1:1 tiling
          grep -q 'class="mark"' out/pieces/front_panel.svg
          grep -q 'class="mark"' out/print/pattern_A4.html

      - name: PDF smoke via preinstalled Chrome
        working-directory: ${{ env.PROJ }}
        run: |
          make pdf CHROME=google-chrome
          find out/print -name 'pattern_A4.pdf' -size +50k | grep -q . \
            || { echo "pattern_A4.pdf missing or suspiciously small"; exit 1; }

      - name: Previews + hero smoke (cockpit tiles, Read gate)
        working-directory: ${{ env.PROJ }}
        run: |
          make previews viz CHROME=google-chrome
          test -f out/layout.png
          test -f out/viz_hero.png
          for f in out/pieces/*.svg; do
            test -f "${f%.svg}.png" || { echo "MISSING PNG for $f"; exit 1; }
          done

      - name: Check gate must refuse a piece wider than the fabric
        working-directory: ${{ env.PROJ }}
        run: |
          if ROBION_PARAMS='{"fabric_width": 400}' uv run pattern.py check; then
            echo "check gate FAILED TO FAIL — oversized piece accepted"
            exit 1
          fi
          echo "check gate refused as expected"
